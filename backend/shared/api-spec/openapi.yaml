openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mitu assistant control plane and mobile action API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Admin dashboard summaries, usage, activity, and users
  - name: config
    description: Remote feature configuration
  - name: mobile
    description: Mobile assistant usage and translation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /dashboard/usage:
    get:
      operationId: getUsageAnalytics
      tags: [dashboard]
      summary: Get usage analytics
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 7d
      responses:
        "200":
          description: Usage analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAnalytics"
  /dashboard/activity:
    get:
      operationId: getActivityLog
      tags: [dashboard]
      summary: Get recent activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
  /dashboard/users:
    get:
      operationId: listUsers
      tags: [dashboard]
      summary: List and search users
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: plan
          in: query
          required: false
          schema:
            type: string
            enum: [all, free, pro]
            default: all
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /dashboard/users/{id}:
    get:
      operationId: getUser
      tags: [dashboard]
      summary: Get a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUserSubscription
      tags: [dashboard]
      summary: Upgrade or downgrade a user's subscription
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
  /remote-config:
    get:
      operationId: getRemoteConfig
      tags: [config]
      summary: Get remote configuration
      responses:
        "200":
          description: Remote config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteConfig"
    patch:
      operationId: updateRemoteConfig
      tags: [config]
      summary: Update remote configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteConfigUpdate"
      responses:
        "200":
          description: Updated remote config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteConfig"
  /mobile/usage:
    post:
      operationId: recordMobileUsage
      tags: [mobile]
      summary: Record a voice, translation, or gesture action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileUsageInput"
      responses:
        "200":
          description: Usage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatus"
        "429":
          description: Daily free limit reached
  /mobile/translate:
    post:
      operationId: translateText
      tags: [mobile]
      summary: Translate a short assistant message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateInput"
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationResult"
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    User:
      type: object
      required: [id, name, email, plan, role, actionsToday, actionLimit, lastActiveAt, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: ["string", "null"] }
        plan:
          type: string
          enum: [free, pro]
        role:
          type: string
          enum: [user, admin]
        actionsToday: { type: integer }
        actionLimit: { type: integer }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    UserList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    SubscriptionUpdate:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, pro]
    DashboardOverview:
      type: object
      required: [totalUsers, freeUsers, proUsers, activeVoiceRequests, actionsToday, apiHealth, uptimeSeconds]
      properties:
        totalUsers: { type: integer }
        freeUsers: { type: integer }
        proUsers: { type: integer }
        activeVoiceRequests: { type: integer }
        actionsToday: { type: integer }
        apiHealth:
          type: string
          enum: [healthy, degraded, offline]
        uptimeSeconds: { type: number }
    UsagePoint:
      type: object
      required: [date, voiceActions, translations, gestureSessions]
      properties:
        date: { type: string }
        voiceActions: { type: integer }
        translations: { type: integer }
        gestureSessions: { type: integer }
    UsageAnalytics:
      type: object
      required: [range, points]
      properties:
        range:
          type: string
          enum: [7d, 30d, 90d]
        points:
          type: array
          items: { $ref: "#/components/schemas/UsagePoint" }
    ActivityLog:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [voice, translation, gesture, subscription, system]
        title: { type: string }
        description: { type: string }
        userName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    RemoteConfig:
      type: object
      required: [freeDailyActionLimit, freeLockScreenLimit, gesturesEnabled, translationEnabled, autoSendEnabled]
      properties:
        freeDailyActionLimit: { type: integer, minimum: 0, maximum: 1000 }
        freeLockScreenLimit: { type: integer, minimum: 0, maximum: 100 }
        gesturesEnabled: { type: boolean }
        translationEnabled: { type: boolean }
        autoSendEnabled: { type: boolean }
    RemoteConfigUpdate:
      type: object
      properties:
        freeDailyActionLimit: { type: integer, minimum: 0, maximum: 1000 }
        freeLockScreenLimit: { type: integer, minimum: 0, maximum: 100 }
        gesturesEnabled: { type: boolean }
        translationEnabled: { type: boolean }
        autoSendEnabled: { type: boolean }
    MobileUsageInput:
      type: object
      required: [userId, actionType]
      properties:
        userId: { type: string }
        actionType:
          type: string
          enum: [voice, translation, gesture, lockscreen]
    UsageStatus:
      type: object
      required: [allowed, plan, used, limit, remaining]
      properties:
        allowed: { type: boolean }
        plan:
          type: string
          enum: [free, pro]
        used: { type: integer }
        limit: { type: integer }
        remaining: { type: integer }
    TranslateInput:
      type: object
      required: [text, sourceLanguage, targetLanguage]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        sourceLanguage: { type: string, minLength: 2, maxLength: 10 }
        targetLanguage: { type: string, minLength: 2, maxLength: 10 }
    TranslationResult:
      type: object
      required: [text, sourceLanguage, targetLanguage, provider]
      properties:
        text: { type: string }
        sourceLanguage: { type: string }
        targetLanguage: { type: string }
        provider: { type: string }